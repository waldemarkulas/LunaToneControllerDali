<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DALI - sterowanie | IPT_Lunatone_v1.0.0</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #1d2630; --muted: #6b7785;
    --accent: #2563eb; --ok: #15803d; --err: #b91c1c; --border: #d5dce4;
    --hover: #eef3fb; --warn: #b45309; --warn-bg: #fef3c7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171d; --card: #1b222b; --text: #e6ebf1; --muted: #8b97a6;
      --accent: #5b8def; --ok: #4ade80; --err: #f87171; --border: #2d3742;
      --hover: #243040; --warn: #fbbf24; --warn-bg: #3a2f12;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171d; --card: #1b222b; --text: #e6ebf1; --muted: #8b97a6;
    --accent: #5b8def; --ok: #4ade80; --err: #f87171; --border: #2d3742;
    --hover: #243040; --warn: #fbbf24; --warn-bg: #3a2f12;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-top: 14px;
  }
  .quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  button {
    font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    cursor: pointer; min-height: 44px;
  }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }
  .combo { position: relative; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text], input[type=number], input[type=password], select {
    font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; width: 100%; min-height: 44px;
  }
  .list {
    position: absolute; left: 0; right: 0; top: 100%; z-index: 10;
    margin: 4px 0 0; padding: 4px 0; list-style: none;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; max-height: 340px; overflow: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,.15);
  }
  .list li { padding: 8px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .list li.active, .list li:hover { background: var(--hover); }
  .list .sub { color: var(--muted); font-size: 12px; }
  .list .empty { color: var(--muted); cursor: default; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .row > div:only-child { grid-column: 1 / -1; }
  .hint { margin-top: 6px; color: var(--muted); font-size: 13px; min-height: 18px; }
  .field { margin-top: 12px; }
  .warn {
    margin-top: 12px; padding: 10px 12px; border-radius: 8px;
    background: var(--warn-bg); color: var(--warn); font-size: 14px;
  }
  .warn label { display: flex; gap: 8px; align-items: center; font-weight: 600; margin: 0; }
  .warn input { width: auto; min-height: auto; }
  .actions { margin-top: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .badge { font-weight: 700; }
  .badge.ok { color: var(--ok); } .badge.err { color: var(--err); }
  pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; margin: 10px 0 0; white-space: pre-wrap; word-break: break-word;
    font: 13px/1.5 ui-monospace, Consolas, monospace; min-height: 60px; max-height: 420px; overflow: auto;
  }
  .hidden { display: none !important; }
  .login { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .login input { flex: 1; min-width: 180px; }
  .tag { font-size: 12px; color: var(--muted); }
  details.bank { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-top: 8px; }
  details.bank summary { cursor: pointer; font-weight: 600; }
  details.bank table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  details.bank td { padding: 4px 6px; border-top: 1px solid var(--border); vertical-align: top; }
  details.bank td.v { font-family: ui-monospace, Consolas, monospace; white-space: nowrap; }
  .summary { font-size: 14px; line-height: 1.6; margin-top: 10px; }
  .tabs { display: flex; gap: 6px; margin: 14px 0 0; border-bottom: 1px solid var(--border); }
  .tab { border-radius: 8px 8px 0 0; border-bottom: none; margin-bottom: -1px; background: transparent; }
  .tab.active { background: var(--card); border-color: var(--border); border-bottom: 1px solid var(--card); font-weight: 700; }
  .scan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; align-items: start; }
  .scan-grid h2 { margin-bottom: 8px; }
  .plain { font-size: 15px; line-height: 1.6; color: var(--text); }
  .plain p { margin: 0 0 10px; }
  .plain ul { margin: 0 0 10px 18px; padding: 0; }
  .plain li { margin-bottom: 4px; }
  @media (max-width: 760px) { .scan-grid { grid-template-columns: 1fr; } }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Sterowanie DALI</h1>
  <div class="muted">Wersja: <span id="version">IPT_Lunatone_v1.0.0</span> · Port: <span id="port">…</span></div>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="viewControl" role="tab">Sterowanie</button>
    <button class="tab" data-tab="viewScan" role="tab">Skan urządzenia</button>
  </nav>

  <section id="loginCard" class="card hidden">
    <label for="token">Token dostępu</label>
    <div class="login">
      <input id="token" type="password" autocomplete="current-password" placeholder="DALI_WEB_TOKEN">
      <button id="saveToken" class="primary">Zaloguj</button>
    </div>
    <div class="hint" id="loginHint"></div>
  </section>


  <div id="viewControl">
  <section class="card">
    <h2>Szybkie akcje</h2>
    <div class="quick">
      <button data-quick="status">Status</button>
      <button data-quick="psu-on">Zasilacz ON</button>
      <button data-quick="psu-off">Zasilacz OFF</button>
      <button data-quick="scan">Skan magistrali</button>
      <button data-quick="device-id">ID adaptera</button>
    </div>
  </section>


  <section class="card">
    <h2>Komenda</h2>
    <label for="cmd">Funkcja</label>
    <div class="combo">
      <input id="cmd" type="text" autocomplete="off"
             placeholder="Wpisz np. lev, dapc, reset, memory… (strzałki i Enter)">
      <ul id="list" class="list hidden" role="listbox"></ul>
    </div>
    <div class="hint" id="cmdHint"></div>

    <!-- pola dla prostych komend (przyciski) -->
    <div class="row">
      <div id="addrBox" class="hidden">
        <label for="address" id="addrLabel">Adres oprawy (0–63)</label>
        <input id="address" type="number" min="0" max="63" step="1" inputmode="numeric">
      </div>
      <div id="valueBox" class="hidden">
        <label for="value" id="valueLabel">Wartość</label>
        <input id="value" type="number" min="0" max="254" step="1" inputmode="numeric">
      </div>
    </div>

    <!-- pola dla dowolnej komendy z katalogu python-dali -->
    <div id="genericBox" class="hidden">
      <div class="row">
        <div id="targetBox">
          <label for="kind">Adresat</label>
          <select id="kind">
            <option value="short">Krótki adres (0–63)</option>
            <option value="group">Grupa (0–15)</option>
            <option value="broadcast">Broadcast (wszystkie)</option>
          </select>
        </div>
        <div id="genAddrBox">
          <label for="genAddress" id="genAddrLabel">Adres</label>
          <input id="genAddress" type="number" min="0" max="63" step="1" inputmode="numeric">
        </div>
      </div>
      <div id="paramsBox"></div>
      <div id="varargsBox" class="field hidden">
        <label for="varargs">Argumenty (po przecinku, opcjonalnie)</label>
        <input id="varargs" type="text" placeholder="np. 1, 2">
      </div>
      <div id="dangerBox" class="warn hidden">
        <label><input id="confirm" type="checkbox"> Potwierdzam: ta komenda zmienia trwale stan lub pamięć urządzenia.</label>
      </div>
    </div>

    <div class="actions">
      <button id="send" class="primary" disabled>Wyślij</button>
      <span id="status" class="badge"></span>
    </div>
    <pre id="output">Wybierz funkcję, aby rozpocząć.</pre>
  </section>

  </div>

  <div id="viewScan" class="hidden">
  <section class="card">
    <h2>Skan urządzenia</h2>
    <div class="row">
      <div>
        <label for="scanAddress">Adres oprawy (0–63)</label>
        <input id="scanAddress" type="number" min="0" max="63" step="1" value="0" inputmode="numeric">
      </div>
      <div style="display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap">
        <button id="scanBtn" class="primary">Skanuj urządzenie</button>
        <button id="saveTxt" disabled>Zapisz do TXT</button>
      </div>
    </div>
    <div class="hint">Odczytuje ID adaptera i oprawy oraz wszystkie banki pamięci z opisami wartości.</div>
    <div id="scanStatus" class="hint"></div>
    <div class="scan-grid">
      <div class="col">
        <h2>Po ludzku</h2>
        <div id="scanPlain" class="plain muted">Najpierw wykonaj skan.</div>
      </div>
      <div class="col">
        <h2>Dane techniczne</h2>
        <div id="scanSummary" class="summary"></div>
        <div id="scanBanks"></div>
      </div>
    </div>
  </section>


  </div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const TOKEN_KEY = "dali_token";
  let items = [];            // komendy nazwane + katalog python-dali
  let selected = null;       // wybrany element listy
  let activeIndex = -1;
  let filtered = [];

  const storage = {
    get() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } },
    set(v) { try { localStorage.setItem(TOKEN_KEY, v); } catch (e) { /* prywatne okno */ } },
  };

  function headers() {
    const h = { "Content-Type": "application/json" };
    const t = storage.get();
    if (t) h["Authorization"] = "Bearer " + t;
    return h;
  }

  async function api(path, options = {}) {
    const res = await fetch(path, { ...options, headers: headers() });
    if (res.status === 401) {
      $("loginCard").classList.remove("hidden");
      $("loginHint").textContent = "Wymagany token. Wpisz go i zaloguj się.";
      throw new Error("unauthorized");
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || ("HTTP " + res.status));
    return data;
  }

  // --- lista z podpowiedziami --------------------------------------------
  function buildItems(data) {
    const named = data.commands.map(c => ({
      kind: "named", id: c.id, label: c.label, group: c.group, sub: c.group + " · " + c.id,
      address: c.address, value: c.value, value_label: c.value_label, dangerous: false,
    }));
    const generic = data.catalog.map(e => ({
      kind: "generic", id: e.id, label: e.name + " — " + e.label,
      group: "DALI " + (e.family === "gear" ? "oprawa" : "urządzenie"),
      sub: e.module + " · " + e.name,
      entry: e, address: e.address, value: false, dangerous: e.dangerous,
    }));
    return [...named, ...generic];
  }

  function matches(query) {
    const q = query.trim().toLowerCase();
    if (!q) return items.slice(0, 200);
    const out = [];
    for (const it of items) {
      const hay = (it.id + " " + it.label + " " + it.group + " " + it.sub).toLowerCase();
      if (hay.includes(q)) out.push(it);
      if (out.length >= 200) break;
    }
    return out;
  }

  function renderList() {
    const list = $("list");
    filtered = matches($("cmd").value);
    list.innerHTML = "";
    if (!filtered.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Brak pasujących funkcji";
      list.appendChild(li);
    }
    filtered.forEach((it, i) => {
      const li = document.createElement("li");
      li.setAttribute("role", "option");
      if (i === activeIndex) li.classList.add("active");
      const name = document.createElement("span");
      name.textContent = it.label + (it.dangerous ? "  ⚠" : "");
      const sub = document.createElement("span");
      sub.className = "sub";
      sub.textContent = it.sub;
      li.append(name, sub);
      li.addEventListener("mousedown", (e) => { e.preventDefault(); choose(it); });
      list.appendChild(li);
    });
    list.classList.remove("hidden");
  }

  function closeList() {
    $("list").classList.add("hidden");
    activeIndex = -1;
  }

  function choose(item) {
    selected = item;
    $("cmd").value = item.label;
    closeList();
    showFields();
  }

  function showFields() {
    const it = selected;
    const named = it && it.kind === "named";
    const generic = it && it.kind === "generic";

    // proste komendy
    $("addrBox").classList.toggle("hidden", !(named && it.address));
    $("valueBox").classList.toggle("hidden", !(named && it.value));
    if (named && it.address) {
      $("addrLabel").textContent = it.address === "optional"
        ? "Adres oprawy (0–63, opcjonalnie)" : "Adres oprawy (0–63)";
    }
    if (named && it.value) $("valueLabel").textContent = it.value_label || "Wartość";

    // dowolna komenda z katalogu
    $("genericBox").classList.toggle("hidden", !generic);
    if (generic) renderGeneric(it.entry);

    $("cmdHint").textContent = !it ? "" : generic
      ? (it.dangerous ? "Komenda niebezpieczna: wymaga potwierdzenia." : "Komenda z python-dali.")
      : "";
    validate();
  }

  function renderGeneric(entry) {
    $("targetBox").classList.toggle("hidden", !entry.address);
    if (!entry.address) $("kind").value = "short";
    updateKind();

    const box = $("paramsBox");
    box.innerHTML = "";
    entry.params.forEach((p, i) => {
      const wrap = document.createElement("div");
      wrap.className = "field";
      const lab = document.createElement("label");
      lab.textContent = p.name + (p.required ? "" : " (opcjonalnie)");
      const inp = document.createElement("input");
      inp.type = "text";
      inp.id = "param" + i;
      inp.dataset.required = p.required ? "1" : "";
      inp.placeholder = p.default !== null && p.default !== undefined ? "domyślnie " + p.default : "";
      inp.addEventListener("input", validate);
      wrap.append(lab, inp);
      box.appendChild(wrap);
    });

    $("varargsBox").classList.toggle("hidden", !entry.varargs);
    $("dangerBox").classList.toggle("hidden", !entry.dangerous);
    $("confirm").checked = false;
  }

  function updateKind() {
    const kind = $("kind").value;
    const needsNumber = kind === "short" || kind === "group";
    $("genAddrBox").classList.toggle("hidden", !needsNumber);
    if (kind === "group") {
      $("genAddrLabel").textContent = "Numer grupy (0–15)";
      $("genAddress").max = 15;
    } else {
      $("genAddrLabel").textContent = "Adres (0–63)";
      $("genAddress").max = 63;
    }
    validate();
  }

  function inRange(value, min, max) {
    return value !== "" && Number.isInteger(Number(value)) && Number(value) >= min && Number(value) <= max;
  }

  function validate() {
    const it = selected;
    let ok = !!it;
    if (it && it.kind === "named") {
      if (it.address === true) ok = ok && inRange($("address").value, 0, 63);
      if (it.address === "optional") {
        ok = ok && ($("address").value === "" || inRange($("address").value, 0, 63));
      }
      if (it.value) ok = ok && inRange($("value").value, 0, 254);
    }
    if (it && it.kind === "generic") {
      const e = it.entry;
      if (e.address) {
        const kind = $("kind").value;
        if (kind === "short") ok = ok && inRange($("genAddress").value, 0, 63);
        if (kind === "group") ok = ok && inRange($("genAddress").value, 0, 15);
      }
      document.querySelectorAll("#paramsBox input").forEach(inp => {
        if (inp.dataset.required) ok = ok && inp.value.trim() !== "";
      });
      if (e.dangerous) ok = ok && $("confirm").checked;
    }
    $("send").disabled = !ok;
    return ok;
  }

  $("cmd").addEventListener("input", () => {
    selected = null;
    activeIndex = -1;
    renderList();
    showFields();
  });
  $("cmd").addEventListener("focus", () => renderList());
  $("cmd").addEventListener("blur", () => setTimeout(closeList, 100));
  $("cmd").addEventListener("keydown", (e) => {
    const open = !$("list").classList.contains("hidden");
    if (e.key === "ArrowDown") {
      e.preventDefault();
      if (!open) renderList();
      activeIndex = Math.min(activeIndex + 1, filtered.length - 1);
      renderList();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      activeIndex = Math.max(activeIndex - 1, 0);
      renderList();
    } else if (e.key === "Enter") {
      // Enter wybiera zaznaczoną podpowiedź, a gdy nic nie zaznaczono, pierwszą z listy.
      if (open && filtered.length) {
        e.preventDefault();
        choose(filtered[activeIndex >= 0 ? activeIndex : 0]);
      }
    } else if (e.key === "Escape") {
      closeList();
    }
  });

  ["address", "value", "genAddress", "varargs", "kind"].forEach(id => $(id).addEventListener("input", validate));
  $("kind").addEventListener("change", updateKind);
  $("confirm").addEventListener("change", validate);

  // --- wysyłanie --------------------------------------------------------
  function setResult(ok, lines) {
    const badge = $("status");
    badge.textContent = ok ? "OK" : "BŁĄD";
    badge.className = "badge " + (ok ? "ok" : "err");
    $("output").textContent = lines.length ? lines.join("\n") : (ok ? "Gotowe." : "Błąd.");
  }

  async function post(path, body) {
    $("send").disabled = true;
    $("status").textContent = "wykonuję…";
    $("status").className = "badge";
    try {
      const data = await api(path, { method: "POST", body: JSON.stringify(body) });
      setResult(data.ok, [...data.output, ...data.errors]);
    } catch (e) {
      if (e.message !== "unauthorized") setResult(false, [e.message]);
      else $("status").textContent = "";
    } finally {
      validate();
    }
  }

  function genericBody(it) {
    const e = it.entry;
    const body = { id: e.id, confirm: $("confirm").checked };
    if (e.address) {
      body.kind = $("kind").value;
      if (body.kind !== "broadcast") body.address = Number($("genAddress").value);
    }
    const args = [];
    document.querySelectorAll("#paramsBox input").forEach(inp => {
      if (inp.value.trim() !== "") args.push(inp.value.trim());
    });
    if (e.varargs) {
      $("varargs").value.split(",").map(s => s.trim()).filter(s => s !== "").forEach(s => args.push(s));
    }
    body.args = args;
    return body;
  }

  $("send").addEventListener("click", () => {
    if (!selected || !validate()) return;
    if (selected.kind === "generic") {
      post("/api/send", genericBody(selected));
      return;
    }
    const body = { command: selected.id };
    if (selected.address === true || (selected.address === "optional" && $("address").value !== "")) {
      body.address = Number($("address").value);
    }
    if (selected.value) body.value = Number($("value").value);
    post("/api/run", body);
  });

  document.querySelectorAll("[data-quick]").forEach(btn => {
    btn.addEventListener("click", () => post("/api/run", { command: btn.dataset.quick }));
  });

  // --- zakładki ----------------------------------------------------------
  document.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === btn));
      ["viewControl", "viewScan"].forEach(id => $(id).classList.toggle("hidden", id !== btn.dataset.tab));
    });
  });

  // --- skan urządzenia ---------------------------------------------------
  let lastReport = null;
  let lastAddress = null;

  function el(tag, text, cls) {
    const node = document.createElement(tag);
    if (text !== undefined && text !== null) node.textContent = text;
    if (cls) node.className = cls;
    return node;
  }

  function renderPlain(lines) {
    const box = $("scanPlain");
    box.classList.remove("muted");
    box.innerHTML = "";
    let list = null;
    let paragraph = null;
    lines.forEach(line => {
      if (line.trim() === "") {
        list = null; paragraph = null;
        return;
      }
      if (line.startsWith("  • ")) {
        if (!list) { list = el("ul"); box.appendChild(list); }
        list.appendChild(el("li", line.slice(4)));
        paragraph = null;
        return;
      }
      if (!paragraph) { paragraph = el("p"); box.appendChild(paragraph); }
      paragraph.append(document.createTextNode(line + " "));
      list = null;
    });
  }

  function renderScan(data) {
    renderPlain(data.plain || []);
    const summary = $("scanSummary");
    summary.innerHTML = "";
    const lines = [
      ["Wersja", data.version],
      ["Adres oprawy", data.address],
      ["Adapter: GTIN / ID / artykuł",
        data.adapter ? `${data.adapter.gtin} / ${data.adapter.id} / ${data.adapter.article_num}` : "brak"],
      ["Oprawa: GTIN", data.identity.gtin],
      ["Oprawa: nr seryjny", data.identity.serial],
      ["Oprawa: firmware", data.identity.firmware],
      ["Ostatni bank", data.last_bank],
      ["Banków odczytanych", data.banks.filter(b => b.exists).length],
    ];
    lines.forEach(([k, v]) => {
      const row = el("div");
      row.append(el("strong", k + ": "), document.createTextNode(String(v)));
      summary.appendChild(row);
    });

    const box = $("scanBanks");
    box.innerHTML = "";
    data.banks.forEach(bank => {
      const det = el("details", null, "bank");
      const sum = el("summary");
      if (!bank.exists) {
        sum.textContent = `Bank ${bank.number}: nie istnieje`;
        det.appendChild(sum);
        box.appendChild(det);
        return;
      }
      if (!bank.data || typeof bank.data === "string") {
        sum.textContent = `Bank ${bank.number}: błąd odczytu ${bank.data || ""}`;
        det.appendChild(sum);
        box.appendChild(det);
        return;
      }
      sum.textContent = `Bank ${bank.number}: ${bank.title} (ostatni adres 0x${bank.last.toString(16).toUpperCase().padStart(2, "0")})`;
      det.appendChild(sum);

      const hex = el("pre");
      const rowsOut = [];
      for (let i = 0; i < bank.data.length; i += 16) {
        const cells = bank.data.slice(i, i + 16).map(b => b === null ? "--" : b.toString(16).toUpperCase().padStart(2, "0"));
        rowsOut.push(i.toString(16).toUpperCase().padStart(2, "0") + ": " + cells.join(" "));
      }
      hex.textContent = rowsOut.join("\n");
      det.appendChild(hex);

      if (bank.rows.length) {
        const table = el("table");
        bank.rows.forEach(r => {
          const tr = el("tr");
          tr.append(el("td", r.name), el("td", r.value !== null ? r.value : "<" + r.status + ">", "v"), el("td", r.doc, "muted"));
          table.appendChild(tr);
        });
        det.appendChild(table);
      }
      box.appendChild(det);
    });
  }

  $("scanBtn").addEventListener("click", async () => {
    const address = Number($("scanAddress").value);
    if (!Number.isInteger(address) || address < 0 || address > 63) {
      $("scanStatus").textContent = "Podaj adres 0–63.";
      return;
    }
    $("scanBtn").disabled = true;
    $("saveTxt").disabled = true;
    $("scanStatus").textContent = "Skanuję… (może potrwać kilkanaście sekund)";
    $("scanSummary").innerHTML = "";
    $("scanBanks").innerHTML = "";
    $("scanPlain").textContent = "Trwa skan…";
    $("scanPlain").classList.add("muted");
    try {
      const data = await api("/api/scan-device", { method: "POST", body: JSON.stringify({ address }) });
      if (!data.ok) {
        $("scanStatus").textContent = "Błąd: " + (data.errors || []).join("; ");
      } else {
        $("scanStatus").textContent = "Skan zakończony.";
        lastReport = data.report;
        lastAddress = address;
        renderScan(data);
        $("saveTxt").disabled = false;
      }
    } catch (e) {
      if (e.message !== "unauthorized") $("scanStatus").textContent = "Błąd: " + e.message;
    } finally {
      $("scanBtn").disabled = false;
    }
  });

  $("saveTxt").addEventListener("click", () => {
    if (!lastReport) return;
    const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
    const blob = new Blob([lastReport.join("\n") + "\n"], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `skan-oprawy-${lastAddress}-${stamp}.txt`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  // --- logowanie tokenem -------------------------------------------------
  $("saveToken").addEventListener("click", async () => {
    storage.set($("token").value.trim());
    $("loginHint").textContent = "";
    await init();
  });

  async function init() {
    try {
      const data = await api("/api/commands");
      items = buildItems(data);
      $("port").textContent = data.port;
      if (data.version) $("version").textContent = data.version;
      $("loginCard").classList.add("hidden");
    } catch (e) {
      if (e.message !== "unauthorized") $("output").textContent = "Nie udało się pobrać listy funkcji: " + e.message;
    }
  }

  init();
})();
</script>
</body>
</html>
